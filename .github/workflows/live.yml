name: 24-7 YouTube live loop

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "ความยาวรอบนี้ (นาที) — 180 = 3 ชม. / 2 = ทดสอบสั้นๆ"
        required: false
        default: "180"
  schedule:
    # ทุก 2 ชม. (ไม่ใช่ 6) โดยตั้งใจ:
    #   job ถูกฆ่าที่ 6 ชม. แต่สคริปต์จบเองที่ 5 ชม. 45 น.
    #   cron ที่ยิงมาซ้ำระหว่างนั้นจะถูก "ต่อคิว" (concurrency group เดียวกัน)
    #   พอ job ปัจจุบันจบ คิวถัดไปเริ่มทันที -> ช่องว่างเหลือ ~0-5 นาที ไม่ใช่ 15-30 นาที
    #   หมายเหตุ: GitHub เก็บคิวไว้แค่ 1 รายการ (ตัวใหม่ทับตัวเก่า) จึงไม่รันซ้อนกัน
    - cron: "0 */2 * * *"

concurrency:
  group: youtube-live
  cancel-in-progress: false # don't kill the running stream when a new run is queued

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Get the loop video
        env:
          VIDEO_URL: ${{ secrets.VIDEO_URL }}         # ลิงก์ตรง mp4 / GitHub Release / R2
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }} # หรือ Drive file id — ไฟล์ใหญ่แค่ไหนก็ได้ runner ดาวน์โหลดเอง
        run: |
          have_gdown() { python3 -c "import gdown" 2>/dev/null || pip install --quiet gdown; }

          if [ -n "${DRIVE_FILE_ID:-}" ]; then
            echo "Downloading from Google Drive id=${DRIVE_FILE_ID}"
            have_gdown
            gdown --id "$DRIVE_FILE_ID" -O loop.mp4 || {
              echo "::error::gdown ล้มเหลว — ตรวจว่าแชร์ไฟล์เป็น Anyone with the link"; exit 1; }
          elif [ -n "${VIDEO_URL:-}" ]; then
            case "$VIDEO_URL" in
              *drive.google.com*)
                echo "VIDEO_URL เป็นลิงก์ Google Drive -> ใช้ gdown"
                have_gdown
                ID=$(echo "$VIDEO_URL" | sed -nE 's#.*(/d/|id=)([A-Za-z0-9_-]{10,}).*#\2#p')
                [ -n "$ID" ] || { echo "::error::แยก file id จากลิงก์ Drive ไม่ได้"; exit 1; }
                gdown --id "$ID" -O loop.mp4 ;;
              *)
                echo "Downloading video from secret VIDEO_URL"
                curl -L --retry 5 --retry-delay 5 --fail -o loop.mp4 "$VIDEO_URL" ;;
            esac
          elif [ -f loop.mp4 ]; then
            echo "Using loop.mp4 committed in the repo"
          else
            echo "::error::No video found. Commit loop.mp4 (<=100MB), or set VIDEO_URL / DRIVE_FILE_ID secret."
            exit 1
          fi

          ls -lh loop.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 loop.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 loop.mp4 \
            | grep -q . || { echo "::error::ไฟล์ที่ได้ไม่ใช่ไฟล์วิดีโอ (อาจเป็นหน้า HTML ของ Drive)"; exit 1; }

      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          VIDEO: loop.mp4
          # 1 = สตรีมด้วย -c:v copy (แนะนำมาก: ไฟล์ต้อง pre-encode ด้วย make_loop_file.sh)
          # 0 = encode สดบน runner (กิน CPU 2 คอร์ -> ภาพกระตุกง่าย)
          COPY_MODE: "1"
          V_BITRATE: 4500k # drop to 2500k for 720p on weaker runners
          A_BITRATE: 192k
          # ⚠ บน GitHub Actions ไม่ควรเปิด backup ingest (upload 2 เท่า -> drop frame)
          # ถ้าย้ายไป VPS ค่อยใส่ rtmp://b.rtmp.youtube.com/live2?backup=1
          BACKUP_URL: ""
          # ความยาวรอบนี้ = ค่าที่กรอกตอนกด Run workflow (default 180 นาที = 3 ชม.)
          # หมายเหตุ: ตัวเลขนี้คือ "ความยาวของ live" ไม่ใช่ความยาวไฟล์
          # เพราะ stream.sh ใช้ -stream_loop -1 วนไฟล์สั้นๆ ได้ไม่จำกัด
          STREAM_MINUTES: ${{ inputs.minutes || '180' }}
        run: |
          chmod +x stream.sh
          MINS="${STREAM_MINUTES%.*}"
          [ -n "$MINS" ] && [ "$MINS" -gt 0 ] 2>/dev/null || MINS=180
          # หัก 60 วิ buffer ให้ ffmpeg ปิดตัวเองก่อน GitHub ฆ่าที่ 6 ชม. พอดี
          export MAX_SECONDS=$(( MINS * 60 - 60 ))
          echo "รอบนี้สตรีม $MINS นาที (MAX_SECONDS=$MAX_SECONDS) จากไฟล์ $(du -h loop.mp4 | cut -f1)"
          ./stream.sh
