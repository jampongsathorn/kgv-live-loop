name: 24-7 YouTube live loop

# =====================================================================
#  หลักการ: 1 job = 1 รอบ (180 นาที = เพลง 63 เพลงไม่ซ้ำ 1 รอบ)
#  เมื่อรอบจบ step สุดท้ายจะ dispatch รอบถัดไปเอง (self-chain)
#  -> ไม่ต้องมีคนกดอะไรอีก ระบบเดินต่อเนื่อง 24/7
#  ช่องว่างระหว่างรอบ ~1-3 นาที (checkout + apt install + โหลดไฟล์ 1.43 GB)
#  broadcast ไม่ปิดเพราะ enableAutoStop=False ตั้งไว้ฝั่ง YouTube แล้ว
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "ความยาวรอบนี้ (นาที) — 180 = 3 ชม. / 2 = ทดสอบสั้นๆ"
        required: false
        default: "180"
  schedule:
    # เป็น "ตัวสำรอง" เท่านั้น (GitHub ไม่การันตี cron) — กลไกหลักคือ self-chain
    - cron: "0 */2 * * *"

concurrency:
  group: youtube-live
  cancel-in-progress: false # อย่าฆ่าไลฟ์ที่กำลังรันอยู่เมื่อมีตัวใหม่เข้าคิว

permissions:
  actions: write   # จำเป็นสำหรับ dispatch รอบถัดไป
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      # --- ปลายทาง YouTube ---
      STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      VIDEO: loop.mp4
      # 1 = สตรีมด้วย -c:v copy (แนะนำมาก: ไฟล์ต้อง pre-encode ด้วย make_loop_file.sh)
      # 0 = encode สดบน runner (กิน CPU 2 คอร์ -> ภาพกระตุกง่าย)
      COPY_MODE: "1"
      V_BITRATE: 4500k # ลดเป็น 2500k ถ้าเน็ต runner อ่อน
      A_BITRATE: 192k
      # ⚠ บน GitHub Actions ไม่ควรเปิด backup ingest (upload 2 เท่า -> drop frame)
      BACKUP_URL: ""
      # 1 = ไฟล์ที่ใช้คือ "1 รอบเต็ม" (เพลงครบชุดไม่ซ้ำ) -> เล่นจบแล้วหยุด ไม่วนซ้ำ
      PLAY_ONCE: "1"
      # ความยาวรอบนี้ = ค่าที่กรอกตอนกด Run workflow (default 180 นาที = 3 ชม.)
      STREAM_MINUTES: ${{ inputs.minutes || '180' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Get the loop video
        env:
          VIDEO_URL: ${{ secrets.VIDEO_URL }}         # ลิงก์ตรง mp4 / GitHub Release / R2
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }} # หรือ Drive file id — ไฟล์ใหญ่แค่ไหนก็ได้ runner ดาวน์โหลดเอง
        run: |
          have_gdown() { python3 -c "import gdown" 2>/dev/null || pip install --quiet gdown; }

          if [ -n "${DRIVE_FILE_ID:-}" ]; then
            echo "Downloading from Google Drive id=${DRIVE_FILE_ID}"
            have_gdown
            gdown --id "$DRIVE_FILE_ID" -O loop.mp4 || {
              echo "::error::gdown ล้มเหลว — ตรวจว่าแชร์ไฟล์เป็น Anyone with the link"; exit 1; }
          elif [ -n "${VIDEO_URL:-}" ]; then
            case "$VIDEO_URL" in
              *drive.google.com*)
                echo "VIDEO_URL เป็นลิงก์ Google Drive -> ใช้ gdown"
                have_gdown
                ID=$(echo "$VIDEO_URL" | sed -nE 's#.*(/d/|id=)([A-Za-z0-9_-]{10,}).*#\2#p')
                [ -n "$ID" ] || { echo "::error::แยก file id จากลิงก์ Drive ไม่ได้"; exit 1; }
                gdown --id "$ID" -O loop.mp4 ;;
              *)
                echo "Downloading video from secret VIDEO_URL"
                curl -L --retry 5 --retry-delay 5 --fail -o loop.mp4 "$VIDEO_URL" ;;
            esac
          elif [ -f loop.mp4 ]; then
            echo "Using loop.mp4 committed in the repo"
          else
            echo "::error::No video found. Commit loop.mp4 (<=100MB), or set VIDEO_URL / DRIVE_FILE_ID secret."
            exit 1
          fi

          ls -lh loop.mp4
          ffprobe -v error -show_entries format=duration,size,bit_rate -of default=nw=1 loop.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 loop.mp4 \
            | grep -q . || { echo "::error::ไฟล์ที่ได้ไม่ใช่ไฟล์วิดีโอ (อาจเป็นหน้า HTML ของ Drive)"; exit 1; }

      - name: Stream to YouTube
        id: stream
        continue-on-error: true
        run: |
          START_TS=$(date +%s)
          chmod +x stream.sh
          MINS="${STREAM_MINUTES%.*}"
          [ -n "$MINS" ] && [ "$MINS" -gt 0 ] 2>/dev/null || MINS=180
          # หัก 60 วิ buffer ให้ ffmpeg ปิดตัวเองก่อน GitHub ฆ่าที่ 6 ชม. พอดี
          export MAX_SECONDS=$(( MINS * 60 - 60 ))
          echo "รอบนี้สตรีม $MINS นาที (MAX_SECONDS=$MAX_SECONDS) จากไฟล์ $(du -h loop.mp4 | cut -f1)"
          set +e
          ./stream.sh
          RC=$?
          ELAPSED=$(( $(date +%s) - START_TS ))
          echo "STREAM_ELAPSED=$ELAPSED" >> "$GITHUB_ENV"
          echo "ffmpeg exit=$RC, สตรีมไปได้ ${ELAPSED}s"
          exit $RC

      - name: Retry once (เฉพาะกรณีหลุดเร็วผิดปกติ)
        if: steps.stream.outcome == 'failure' && env.STREAM_ELAPSED != '' && env.STREAM_ELAPSED < 600
        env:
          STREAM_MINUTES: "5"
        run: |
          echo "รอบแรกหลุดภายใน ${STREAM_ELAPSED}s — ลองต่อใหม่ 1 ครั้ง"
          sleep 30
          chmod +x stream.sh
          export MAX_SECONDS=$(( 5 * 60 - 60 ))
          set +e
          ./stream.sh
          echo "retry exit=$?"

      - name: Chain next round (self re-dispatch)
        # จบรอบ -> สั่งรอบถัดไปเอง ไม่ต้องมีคนกด
        # ใช้ GITHUB_TOKEN ได้เพราะ GitHub ยกเว้น workflow_dispatch/repository_dispatch
        # จากการกันลูปเรียกซ้ำ (event ที่ยิงด้วย GITHUB_TOKEN ปกติจะไม่สร้าง run ใหม่)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELAPSED: ${{ env.STREAM_ELAPSED }}
        run: |
          if [ -z "${ELAPSED:-}" ] || [ "${ELAPSED:-0}" -lt 600 ]; then
            echo "::error::รอบนี้สตรีมไม่ถึง 10 นาที — ไม่ต่อรอบอัตโนมัติ (กันลูปพัง) กรุณาตรวจ stream health แล้ว dispatch เอง"
            exit 0
          fi
          MINS="${STREAM_MINUTES%.*}"
          [ -n "$MINS" ] && [ "$MINS" -gt 0 ] 2>/dev/null || MINS=180
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/live.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"minutes\":\"$MINS\"}}" \
            -w "chain HTTP=%{http_code}\n"
          echo "สั่งรอบถัดไปแล้ว ($MINS นาที)"
